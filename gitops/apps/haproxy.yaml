apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: haproxy
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://haproxytech.github.io/helm-charts
      chart: kubernetes-ingress
      targetRevision: 1.57.1
      helm:
        valueFiles:
          - $values/platform/haproxy/values.yaml
        releaseName: haproxy-ingress
    - repoURL: http://gitea.gitea.svc.cluster.local:3000/labadmin/local-kubenrtetes.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
