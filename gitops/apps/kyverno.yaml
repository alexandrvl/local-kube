apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kyverno.github.io/kyverno/
      chart: kyverno
      targetRevision: 3.10.0
      helm:
        valueFiles:
          - $values/platform/kyverno/values.yaml
    - repoURL: http://gitea.gitea.svc.cluster.local:3000/labadmin/local-kubenrtetes.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Client-side apply stores the whole CRD in last-applied-configuration.
      # The Kyverno policy CRDs exceed the 256KiB annotation limit, so the
      # MutatingPolicy CRD never lands and the controllers crash.
      - ServerSideApply=true
