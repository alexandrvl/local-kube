injector:
  enabled: false
server:
  image:
    repository: hashicorp/vault
    tag: "2.2.2"
  dev:
    enabled: false
  nodeSelector:
    kubernetes.io/hostname: k3s-server
  dataStorage:
    enabled: true
    size: 1Gi
    storageClass: local-path
  standalone:
    enabled: true
    config: |
      ui = true
      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }
      storage "file" {
        path = "/vault/data"
      }
  extraVolumes:
    - type: secret
      name: vault-unseal
  postStart:
    - /bin/sh
    - -c
    - |
      export VAULT_ADDR=http://127.0.0.1:8200
      i=0
      while [ "$i" -lt 30 ]; do
        if vault status > /tmp/vault-status 2>&1; then
          exit 0
        fi
        if grep -q Sealed /tmp/vault-status; then
          vault operator unseal "$(cat /vault/userconfig/vault-unseal/unseal-key)" && exit 0
        fi
        i=$((i+1))
        sleep 2
      done
      exit 1
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
ui:
  enabled: true
  serviceType: ClusterIP
