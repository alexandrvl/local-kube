injector:
  enabled: true
  replicas: 1
  nodeSelector:
    kubernetes.io/hostname: k3s-agent
  agentImage:
    repository: hashicorp/vault
    tag: "2.2.2"
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi
  agentDefaults:
    cpuLimit: "100m"
    cpuRequest: "10m"
    memLimit: "96Mi"
    memRequest: "32Mi"
    templateConfig:
      exitOnRetryFailure: true
      staticSecretRenderInterval: "30s"
server:
  image:
    repository: hashicorp/vault
    tag: "2.2.2"
  dev:
    enabled: false
  nodeSelector:
    kubernetes.io/hostname: k3s-server
  dataStorage:
    enabled: true
    size: 1Gi
    storageClass: local-path
  standalone:
    enabled: true
    config: |
      ui = true
      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }
      storage "file" {
        path = "/vault/data"
      }
  extraVolumes:
    - type: secret
      name: vault-unseal
    - type: secret
      name: vault-ui
    - type: configMap
      name: vault-auth
  postStart:
    - /bin/sh
    - -c
    - |
      export VAULT_ADDR=http://127.0.0.1:8200
      i=0
      while [ "$i" -lt 30 ]; do
        if vault status > /tmp/vault-status 2>&1; then
          break
        fi
        if grep -q Sealed /tmp/vault-status; then
          vault operator unseal "$(cat /vault/userconfig/vault-unseal/unseal-key)" && break
        fi
        i=$((i+1))
        sleep 2
      done
      vault status >/dev/null
      export VAULT_TOKEN="$(cat /vault/userconfig/vault-unseal/root-token)"
      vault policy write team-a /vault/userconfig/vault-auth/team-a.hcl
      vault policy write team-b /vault/userconfig/vault-auth/team-b.hcl
      vault write auth/kubernetes/role/team-a \
        bound_service_account_names=team-a \
        bound_service_account_namespaces=team-a \
        audience="https://kubernetes.default.svc.cluster.local" \
        policies=team-a \
        ttl=1h
      vault write auth/kubernetes/role/team-b \
        bound_service_account_names=team-b \
        bound_service_account_namespaces=team-b \
        audience="https://kubernetes.default.svc.cluster.local" \
        policies=team-b \
        ttl=1h
      vault policy write team-c /vault/userconfig/vault-auth/team-c.hcl
      vault policy write team-a-issuer /vault/userconfig/vault-auth/team-a-issuer.hcl
      vault policy write team-b-issuer /vault/userconfig/vault-auth/team-b-issuer.hcl
      vault policy write team-c-issuer /vault/userconfig/vault-auth/team-c-issuer.hcl
      vault write auth/kubernetes/role/team-c \
        bound_service_account_names=team-c \
        bound_service_account_namespaces=team-c \
        audience="https://kubernetes.default.svc.cluster.local" \
        policies=team-c \
        ttl=1h
      vault write auth/kubernetes/role/team-a-issuer \
        bound_service_account_names=token-controller \
        bound_service_account_namespaces=team-a \
        audience="https://kubernetes.default.svc.cluster.local" \
        policies=team-a-issuer \
        ttl=1h
      vault write auth/kubernetes/role/team-b-issuer \
        bound_service_account_names=token-controller \
        bound_service_account_namespaces=team-b \
        audience="https://kubernetes.default.svc.cluster.local" \
        policies=team-b-issuer \
        ttl=1h
      vault write auth/kubernetes/role/team-c-issuer \
        bound_service_account_names=token-controller \
        bound_service_account_namespaces=team-c \
        audience="https://kubernetes.default.svc.cluster.local" \
        policies=team-c-issuer \
        ttl=1h
      vault auth enable userpass >/tmp/userpass-enable 2>&1 || true
      if [ -f /vault/userconfig/vault-ui/team-a ]; then
        vault write auth/userpass/users/team-a password="$(cat /vault/userconfig/vault-ui/team-a)" policies=team-a
        vault write auth/userpass/users/team-b password="$(cat /vault/userconfig/vault-ui/team-b)" policies=team-b
        vault write auth/userpass/users/team-c password="$(cat /vault/userconfig/vault-ui/team-c)" policies=team-c
      fi
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
ui:
  enabled: true
  serviceType: ClusterIP
