apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample
  namespace: team-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sample
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9898"
        prometheus.io/path: "/metrics"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "team-a"
        vault.hashicorp.com/agent-inject-secret-demo: "secret/data/teams/team-a/demo"
        vault.hashicorp.com/agent-inject-template-demo: |
          {{- with secret "secret/data/teams/team-a/demo" -}}
          {{ .Data.data.value }}
          {{- end }}
    spec:
      serviceAccountName: team-a
      containers:
        - name: sample
          image: ghcr.io/stefanprodan/podinfo:6.17.0
          ports:
            - name: http
              containerPort: 9898
          env:
            - name: PODINFO_UI_LOGO
              value: ""
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sample
  namespace: team-a
  labels:
    app.kubernetes.io/name: sample
spec:
  selector:
    app.kubernetes.io/name: sample
  ports:
    - name: http
      port: 9898
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample
  namespace: team-a
  annotations:
    cert-manager.io/cluster-issuer: platform-ca
spec:
  ingressClassName: haproxy
  tls:
    - hosts:
        - sample.lab.test
      secretName: sample-tls
  rules:
    - host: sample.lab.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sample
                port:
                  number: 9898
