global:
  domain: argocd.lab.local
configs:
  params:
    server.insecure: "true"
    reposerver.parallelism.limit: "1"
  cm:
    timeout.reconciliation: 180s
    admin.enabled: "true"
    resource.customizations.health.networking.k8s.io_Ingress: |
      hs = {}
      hs.status = "Healthy"
      hs.message = "HAProxy serves this Ingress on node host ports 80 and 443"
      return hs
dex:
  enabled: false
notifications:
  enabled: false
controller:
  replicas: 1
  # The 4G server OOM-killed this process at 512Mi. Keep it on the agent.
  nodeSelector:
    kubernetes.io/hostname: k3s-agent
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 768Mi
repoServer:
  replicas: 1
  env:
    - name: ARGOCD_EXEC_TIMEOUT
      value: 10m
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
server:
  replicas: 1
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
applicationSet:
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 192Mi
redis:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
