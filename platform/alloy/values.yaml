crds:
  create: false
alloy:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

      discovery.relabel "annotated_metrics" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
          action        = "keep"
          regex         = "true"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
          action        = "replace"
          target_label  = "__metrics_path__"
          regex         = "(.+)"
        }
        rule {
          source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
          action        = "replace"
          regex         = "([^:]+)(?::\\d+)?;(\\d+)"
          replacement   = "$1:$2"
          target_label  = "__address__"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
      }

      discovery.relabel "cilium" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_label_k8s_app"]
          action        = "keep"
          regex         = "cilium"
        }
        rule {
          source_labels = ["__address__"]
          action        = "replace"
          regex         = "([^:]+)(?::\\d+)?"
          replacement   = "$1:9962"
          target_label  = "__address__"
        }
      }

      discovery.relabel "hubble" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_label_k8s_app"]
          action        = "keep"
          regex         = "cilium"
        }
        rule {
          source_labels = ["__address__"]
          action        = "replace"
          regex         = "([^:]+)(?::\\d+)?"
          replacement   = "$1:9965"
          target_label  = "__address__"
        }
      }

      discovery.relabel "node_exporter" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          action        = "keep"
          regex         = "prometheus-node-exporter"
        }
        rule {
          source_labels = ["__address__"]
          action        = "replace"
          regex         = "([^:]+)(?::\\d+)?"
          replacement   = "$1:9100"
          target_label  = "__address__"
        }
      }

      prometheus.scrape "pods" {
        targets    = discovery.relabel.annotated_metrics.output
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      prometheus.scrape "cilium" {
        targets    = discovery.relabel.cilium.output
        forward_to = [prometheus.remote_write.mimir.receiver]
        job_name   = "cilium"
      }

      prometheus.scrape "hubble" {
        targets    = discovery.relabel.hubble.output
        forward_to = [prometheus.remote_write.mimir.receiver]
        job_name   = "hubble"
      }

      prometheus.scrape "node" {
        targets    = discovery.relabel.node_exporter.output
        forward_to = [prometheus.remote_write.mimir.receiver]
        job_name   = "node-exporter"
      }

      prometheus.scrape "kube_state" {
        targets = [{
          __address__ = "kube-state-metrics.observability.svc.cluster.local:8080",
        }]
        forward_to = [prometheus.remote_write.mimir.receiver]
        job_name   = "kube-state-metrics"
      }

      prometheus.scrape "node_service" {
        targets = [{
          __address__ = "node-exporter.observability.svc.cluster.local:9100",
        }]
        forward_to = [prometheus.remote_write.mimir.receiver]
        job_name   = "node-exporter-service"
      }

      prometheus.remote_write "mimir" {
        endpoint {
          url = "http://mimir.observability.svc.cluster.local:9009/api/v1/push"
        }
      }
controller:
  type: daemonset
