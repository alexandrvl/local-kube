log:
  level: info
runner:
  file: /data/.runner
  capacity: 1
  labels:
    - ubuntu-latest:docker://docker:27-cli
container:
  network: host
  # The docker job already mounts the host socket. A second bind fails with
  # "Duplicate mount point: /var/run/docker.sock".
  options: "-v /usr/local/share/ca-certificates/lab-platform-ca.crt:/opt/lab-ca.crt:ro"
  valid_volumes:
    - /var/run/docker.sock
    - /usr/local/share/ca-certificates/lab-platform-ca.crt
