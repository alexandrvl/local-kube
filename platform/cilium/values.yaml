# Cilium 1.20.5 on k3s with flannel and kube-proxy disabled.
# Pod CIDR matches the k3s default. Tunnel mode is used because the nodes
# sit on the Multipass DHCP bridge and do not route pod IPs natively.
kubeProxyReplacement: "true"
k8sServiceHost: 10.114.66.182
k8sServicePort: "6443"
routingMode: tunnel
tunnelProtocol: vxlan
bpf:
  masquerade: true
ipam:
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.42.0.0/16
operator:
  replicas: 1
hubble:
  enabled: true
  metrics:
    enableOpenMetrics: true
    enabled:
      - dns:query
      - drop
      - tcp
      - flow
      - icmp
      - http
  relay:
    enabled: true
  ui:
    enabled: true
# Stay on "default" so a pod is enforced only once a policy selects it.
# Restricted namespaces are selected by the platform network policies.
policyEnforcementMode: default
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
