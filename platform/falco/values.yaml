tty: true
driver:
  kind: modern_ebpf
falco:
  json_output: true
  priority: notice
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 384Mi
controller:
  kind: daemonset
# The image already contains falco_rules.yaml. falcoctl would download a newer
# index from GitHub, and pods cannot open world TCP 443.
falcoctl:
  artifact:
    install:
      enabled: false
    follow:
      enabled: false
