apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: kube-system-platform
spec:
  description: kube-system may talk to the API, the node, health checks, and the ingress controller. Hubble UI is in this namespace.
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: kube-system
  ingress:
    - fromEntities:
        - host
        - remote-node
        - health
        - kube-apiserver
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ingress
  egress:
    - toEntities:
        - host
        - remote-node
        - health
        - kube-apiserver
