apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: restricted-baseline
spec:
  description: Default deny for every namespace, including kube-system. kube-system-platform adds the explicit allows.
  endpointSelector: {}
  ingress:
    - fromEntities:
        - host
        - remote-node
        - health
        - kube-apiserver
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ingress
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
  egress:
    - toEntities:
        - host
        - remote-node
        - health
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ingress-controller
spec:
  description: HAProxy accepts external clients and can reach every backend, including Hubble in kube-system.
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: ingress
  ingress:
    - fromEntities:
        - world
        - host
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "8443"
              protocol: TCP
            - port: "1042"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: argocd-git-and-charts
spec:
  description: Argo CD reaches in-cluster Gitea and public Helm chart repositories.
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: argocd
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: gitea
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: gitea-from-argocd
spec:
  description: Gitea accepts git and API traffic from Argo CD.
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: gitea
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: vault-from-teams
spec:
  description: Team namespaces and the ingress controller may reach Vault.
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: vault
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: In
              values:
                - team-a
                - team-b
                - team-c
                - ingress
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: teams-to-vault
spec:
  description: Team workloads may read Vault and nothing else outside their namespace, DNS, and the API.
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: In
        values:
          - team-a
          - team-b
          - team-c
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: vault
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: registry-pulls
spec:
  description: Pods may pull from the in-cluster Harbor registry. Public image pulls are done by containerd on the node and are outside NetworkPolicy.
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - kube-system
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: harbor
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "5000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: opencost-to-mimir
spec:
  description: OpenCost queries Mimir.
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: opencost
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "9009"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: mimir-from-opencost
spec:
  description: Mimir accepts OpenCost queries.
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: observability
      app.kubernetes.io/name: mimir
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: opencost
      toPorts:
        - ports:
            - port: "9009"
              protocol: TCP

