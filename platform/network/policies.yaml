apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: restricted-baseline
spec:
  description: Default deny for every namespace, including kube-system. kube-system-platform adds the explicit allows.
  endpointSelector: {}
  ingress:
    - fromEntities:
        - host
        - remote-node
        - health
        - kube-apiserver
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ingress
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
  egress:
    - toEntities:
        - host
        - remote-node
        - health
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ingress-controller
spec:
  description: HAProxy accepts external clients and can reach every backend, including Hubble in kube-system.
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: ingress
  ingress:
    - fromEntities:
        - world
        - host
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "8443"
              protocol: TCP
            - port: "1042"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: argocd-git-and-charts
spec:
  description: Argo CD reaches in-cluster Gitea and the Helm chart names below. Other public registries are not included. The DNS rule is what lets toFQDNs learn those addresses.
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: argocd
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: gitea
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # The proxy has to see the lookup or toFQDNs never learns an address.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Chart indexes and tarballs only. Not an allow for every public registry.
    - toFQDNs:
        - matchName: helm.cilium.io
        - matchName: cilium.github.io
        - matchName: helm.releases.hashicorp.com
        - matchName: helm.goharbor.io
        - matchName: charts.jetstack.io
        - matchName: github.com
        - matchPattern: "*.github.io"
        - matchPattern: "*.githubusercontent.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
---
apiVersion: cilium.io/v2
