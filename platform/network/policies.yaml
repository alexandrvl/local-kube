apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: pods-no-world-https
spec:
  description: Pods other than Harbor and Argo CD may not open TCP 443 to the world. This is the registry control. It does not depend on a hostname list. Deny wins over a broader allow.
  enableDefaultDeny:
    egress: false
    ingress: false
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - harbor
          - argocd
  egressDeny:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: node-no-world-https
spec:
  description: The node root namespace, including host-network pods, may not open TCP 443 to the world. Image pulls go through Harbor. Everything else on the node stays allowed, then this deny wins.
  # Empty selects every node. The host identity does not carry
  # kubernetes.io/os, so a label selector never matched.
  nodeSelector: {}
  egress:
    - toEntities:
        - all
  egressDeny:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: harbor-proxy-upstream
spec:
  description: Harbor is the only image-pull proxy. Its pods may reach public registries. The node root namespace may not.
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: harbor
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
