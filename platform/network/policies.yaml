        - matchLabels:
            app.kubernetes.io/component: gateway
  ingressDeny:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ingress
    - fromEndpoints:
        - matchExpressions:
            - key: k8s:app.kubernetes.io/component
              operator: NotIn
              values:
                - gateway
    - fromEndpoints:
        - matchExpressions:
            - key: k8s:app.kubernetes.io/component
              operator: DoesNotExist
