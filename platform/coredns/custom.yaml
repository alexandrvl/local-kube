apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  # The stock Corefile already loads the hosts plugin, which can appear only once.
  # Answer every lab.test name with the server node, where HAProxy listens.
  lab.override: |
    template IN A lab.test {
      match ^.*\.lab\.test\.$
      answer "{{ .Name }} 60 IN A 10.114.66.211"
      fallthrough
    }
