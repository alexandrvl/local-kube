apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-team-app-label
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: team-namespace
      expression: "request.namespace in ['team-a', 'team-b', 'team-c']"
  validations:
    - expression: "has(object.metadata.labels) && 'app.kubernetes.io/name' in object.metadata.labels && size(object.metadata.labels['app.kubernetes.io/name']) > 0"
      message: "Pods in team namespaces must set the label app.kubernetes.io/name."
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privileged-teams
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: team-namespace
      expression: "request.namespace in ['team-a', 'team-b', 'team-c']"
  validations:
    - expression: "object.spec.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged == false)"
      message: "Privileged containers are not allowed in team namespaces."
