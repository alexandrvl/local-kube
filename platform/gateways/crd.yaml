apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: customertokens.lab.test
spec:
  group: lab.test
  scope: Namespaced
  names:
    plural: customertokens
    singular: customertoken
    kind: CustomerToken
    shortNames: [ctok]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [domain, api, customer, ttl, overlap]
              properties:
                domain:
                  type: string
                api:
                  type: string
                customer:
                  type: string
                ttl:
                  type: string
                overlap:
                  type: string
            status:
              type: object
              properties:
                jti:
                  type: string
                kid:
                  type: string
                issuedAt:
                  type: string
                expiresAt:
                  type: string
                previous:
                  type: object
                  properties:
                    jti:
                      type: string
                    kid:
                      type: string
                    issuedAt:
                      type: string
                    expiresAt:
                      type: string
      additionalPrinterColumns:
        - name: Customer
          type: string
          jsonPath: .spec.customer
        - name: API
          type: string
          jsonPath: .spec.api
        - name: Expires
          type: string
          jsonPath: .status.expiresAt
        - name: JTI
          type: string
          jsonPath: .status.jti
