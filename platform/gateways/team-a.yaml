apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: physical-trading-signer
  namespace: team-a
spec:
  secretName: physical-trading-signer
  commonName: physical-trading-signer
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  usages:
    - digital signature
  issuerRef:
    name: platform-ca
    kind: ClusterIssuer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: token-controller
  namespace: team-a
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: token-controller
  namespace: team-a
rules:
  - apiGroups: ["lab.test"]
    resources: ["customertokens"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["lab.test"]
    resources: ["customertokens/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["physical-trading-signer"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["signer-previous", "signer-observed"]
    verbs: ["get", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: token-controller
  namespace: team-a
subjects:
  - kind: ServiceAccount
    name: token-controller
    namespace: team-a
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: token-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timeseries
  namespace: team-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: timeseries
  template:
    metadata:
      labels:
        app.kubernetes.io/name: timeseries
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: team-a
      nodeSelector:
        kubernetes.io/hostname: k3s-agent
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: timeseries
          image: harbor.lab.test/team-a/timeseries:current
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: revoked
              mountPath: /etc/revoked
              readOnly: true
      volumes:
        - name: revoked
          configMap:
            name: gateway-revoked
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: timeseries
  namespace: team-a
spec:
  selector:
    app.kubernetes.io/name: timeseries
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jwks
  namespace: team-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jwks
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jwks
        app.kubernetes.io/component: jwks
    spec:
      serviceAccountName: team-a
      nodeSelector:
        kubernetes.io/hostname: k3s-agent
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: jwks
          image: harbor.lab.test/lab/jwks:current
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: jwks
              mountPath: /etc/jwks
              readOnly: true
      volumes:
        - name: jwks
          configMap:
            name: gateway-jwks
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: jwks
  namespace: team-a
spec:
  selector:
    app.kubernetes.io/name: jwks
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: physical-trading-gateway
  namespace: team-a
data:
  krakend.json: |
    {
      "version": 4,
      "name": "physical-trading",
      "port": 8080,
      "timeout": "5s",
      "endpoints": [
        {
          "endpoint": "/.well-known/jwks.json",
          "method": "GET",
          "output_encoding": "no-op",
          "backend": [
            {
              "url_pattern": "/.well-known/jwks.json",
              "host": ["http://jwks:8080"],
              "encoding": "no-op"
            }
          ]
        },
        {
          "endpoint": "/time-series",
          "method": "POST",
          "input_headers": ["User", "X-Customer", "Token"],
          "output_encoding": "no-op",
          "extra_config": {
            "auth/validator": {
              "alg": "RS256",
              "auth_header_name": "Token",
              "jwk_url": "http://jwks:8080/.well-known/jwks.json",
              "disable_jwk_security": true,
              "cache": true,
              "cache_duration": 60,
              "audience": ["physical-trading/time-series"],
              "issuer": "https://physical-trading.trading.lab.test",
              "propagate_claims": [["sub", "X-Customer"]],
              "failed_jwk_key_cooldown": "10s"
            },
            "validation/cel": [
              {
                "check_expr": "size(req_headers['User']) == 1 && size(req_headers['X-Customer']) == 1 && req_headers['User'][0] == req_headers['X-Customer'][0]"
              }
            ]
          },
          "backend": [
            {
              "url_pattern": "/time-series",
              "method": "POST",
              "host": ["http://timeseries:8080"],
              "encoding": "no-op"
            }
          ]
        },
        {
          "endpoint": "/time-series/{type}",
          "method": "GET",
          "input_headers": ["User", "X-Customer", "Token"],
          "output_encoding": "no-op",
          "extra_config": {
            "auth/validator": {
              "alg": "RS256",
              "auth_header_name": "Token",
              "jwk_url": "http://jwks:8080/.well-known/jwks.json",
              "disable_jwk_security": true,
              "cache": true,
              "cache_duration": 60,
              "audience": ["physical-trading/time-series"],
              "issuer": "https://physical-trading.trading.lab.test",
              "propagate_claims": [["sub", "X-Customer"]],
              "failed_jwk_key_cooldown": "10s"
            },
            "validation/cel": [
              {
                "check_expr": "size(req_headers['User']) == 1 && size(req_headers['X-Customer']) == 1 && req_headers['User'][0] == req_headers['X-Customer'][0]"
              }
            ]
          },
          "backend": [
            {
              "url_pattern": "/time-series/{type}",
              "method": "GET",
              "host": ["http://timeseries:8080"],
              "encoding": "no-op"
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: physical-trading-gateway
  namespace: team-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: physical-trading-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: physical-trading-gateway
        app.kubernetes.io/component: gateway
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-agent
      containers:
        - name: krakend
          image: docker.io/library/krakend:3.0.5
          args: ["run", "-c", "/etc/krakend/krakend.json"]
          env:
            - name: USAGE_DISABLE
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /__health
              port: http
            initialDelaySeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/krakend/krakend.json
              subPath: krakend.json
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: physical-trading-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: physical-trading-gateway
  namespace: team-a
spec:
  selector:
    app.kubernetes.io/name: physical-trading-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: physical-trading
  namespace: team-a
  annotations:
    cert-manager.io/cluster-issuer: platform-ca
spec:
  ingressClassName: haproxy
  tls:
    - hosts:
        - physical-trading.trading.lab.test
      secretName: physical-trading-tls
  rules:
    - host: physical-trading.trading.lab.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: physical-trading-gateway
                port:
                  number: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-controller
  namespace: team-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: token-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: token-controller
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: token-controller
      nodeSelector:
        kubernetes.io/hostname: k3s-agent
      containers:
        - name: controller
          image: harbor.lab.test/lab/token-controller:current
          imagePullPolicy: Always
          env:
            - name: TEAM
              value: team-a
            - name: VAULT_ADDR
              value: http://vault.vault.svc.cluster.local:8200
            - name: VAULT_ROLE
              value: team-a-issuer
            - name: SIGNER_SECRET
              value: physical-trading-signer
            - name: PREVIOUS_SECRET
              value: signer-previous
            - name: OBSERVED_SECRET
              value: signer-observed
            - name: JWKS_CONFIGMAP
              value: gateway-jwks
            - name: REVOKED_CONFIGMAP
              value: gateway-revoked
            - name: ISSUER
              value: https://physical-trading.trading.lab.test
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 96Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: vault-token
              mountPath: /var/run/secrets/vault
              readOnly: true
      volumes:
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: https://kubernetes.default.svc.cluster.local
                  expirationSeconds: 3600
---
apiVersion: lab.test/v1
kind: CustomerToken
metadata:
  name: acme-physical-trading-time-series
  namespace: team-a
spec:
  domain: trading
  api: physical-trading/time-series
  customer: acme
  # Short lifetime so the overlap can be observed in one run.
  # The agreed schedule is ttl 720h and overlap 168h.
  ttl: 3m
  overlap: 90s
---
apiVersion: lab.test/v1
kind: CustomerToken
metadata:
  name: globex-physical-trading-time-series
  namespace: team-a
spec:
  domain: trading
  api: physical-trading/time-series
  customer: globex
  ttl: 3m
  overlap: 90s
