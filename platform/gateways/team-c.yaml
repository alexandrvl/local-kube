apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: customers-signer
  namespace: team-c
spec:
  secretName: customers-signer
  commonName: customers-signer
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
  usages:
    - digital signature
  issuerRef:
    name: platform-ca
    kind: ClusterIssuer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: token-controller
  namespace: team-c
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: token-controller
  namespace: team-c
rules:
  - apiGroups: ["lab.test"]
    resources: ["customertokens"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["lab.test"]
    resources: ["customertokens/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["customers-signer", "signer-previous"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: token-controller
  namespace: team-c
subjects:
  - kind: ServiceAccount
    name: token-controller
    namespace: team-c
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: token-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customers-api
  namespace: team-c
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: customers-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customers-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: team-c
      nodeSelector:
        kubernetes.io/hostname: k3s-agent
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: customers
          image: harbor.lab.test/team-c/customers:current
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: jwks
              mountPath: /etc/jwks
              readOnly: true
      volumes:
        - name: jwks
          configMap:
            name: gateway-jwks
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: customers-api
  namespace: team-c
spec:
  selector:
    app.kubernetes.io/name: customers-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: customers-gateway
  namespace: team-c
data:
  krakend.json: |
    {
      "version": 4,
      "name": "customers",
      "port": 8080,
      "timeout": "5s",
      "endpoints": [
        {
          "endpoint": "/.well-known/jwks.json",
          "method": "GET",
          "output_encoding": "no-op",
          "backend": [
            {
              "url_pattern": "/.well-known/jwks.json",
              "host": ["http://customers-api:8080"],
              "encoding": "no-op"
            }
          ]
        },
        {
          "endpoint": "/customers",
          "method": "POST",
          "input_headers": ["User", "X-Customer"],
          "output_encoding": "no-op",
          "extra_config": {
            "auth/validator": {
              "alg": "RS256",
              "auth_header_name": "Token",
              "jwk_url": "http://customers-api:8080/.well-known/jwks.json",
              "disable_jwk_security": true,
              "cache": true,
              "cache_duration": 60,
              "audience": ["customers"],
              "issuer": "https://customers.customer.lab.test",
              "propagate_claims": [["sub", "X-Customer"]],
              "failed_jwk_key_cooldown": "10s"
            },
            "validation/cel": [
              {
                "check_expr": "size(req_headers['User']) == 1 && size(req_headers['X-Customer']) == 1 && req_headers['User'][0] == req_headers['X-Customer'][0]"
              }
            ]
          },
          "backend": [
            {
              "url_pattern": "/customers",
              "method": "POST",
              "host": ["http://customers-api:8080"],
              "encoding": "no-op"
            }
          ]
        },
        {
          "endpoint": "/customers/{name}",
          "method": "GET",
          "input_headers": ["User", "X-Customer"],
          "output_encoding": "no-op",
          "extra_config": {
            "auth/validator": {
              "alg": "RS256",
              "auth_header_name": "Token",
              "jwk_url": "http://customers-api:8080/.well-known/jwks.json",
              "disable_jwk_security": true,
              "cache": true,
              "cache_duration": 60,
              "audience": ["customers"],
              "issuer": "https://customers.customer.lab.test",
              "propagate_claims": [["sub", "X-Customer"]],
              "failed_jwk_key_cooldown": "10s"
            },
            "validation/cel": [
              {
                "check_expr": "size(req_headers['User']) == 1 && size(req_headers['X-Customer']) == 1 && req_headers['User'][0] == req_headers['X-Customer'][0]"
              }
            ]
          },
          "backend": [
            {
              "url_pattern": "/customers/{name}",
              "method": "GET",
              "host": ["http://customers-api:8080"],
              "encoding": "no-op"
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customers-gateway
  namespace: team-c
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: customers-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customers-gateway
        app.kubernetes.io/component: gateway
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-agent
      containers:
        - name: krakend
          image: docker.io/library/krakend:3.0.5
          args: ["run", "-c", "/etc/krakend/krakend.json"]
          env:
            - name: USAGE_DISABLE
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /__health
              port: http
            initialDelaySeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/krakend/krakend.json
              subPath: krakend.json
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: customers-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: customers-gateway
  namespace: team-c
spec:
  selector:
    app.kubernetes.io/name: customers-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: customers
  namespace: team-c
  annotations:
    cert-manager.io/cluster-issuer: platform-ca
spec:
  ingressClassName: haproxy
  tls:
    - hosts:
        - customers.customer.lab.test
      secretName: customers-tls
  rules:
    - host: customers.customer.lab.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: customers-gateway
                port:
                  number: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-controller
  namespace: team-c
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: token-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: token-controller
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: token-controller
      nodeSelector:
        kubernetes.io/hostname: k3s-agent
      containers:
        - name: controller
          image: harbor.lab.test/lab/token-controller:current
          imagePullPolicy: Always
          env:
            - name: TEAM
              value: team-c
            - name: VAULT_ADDR
              value: http://vault.vault.svc.cluster.local:8200
            - name: VAULT_ROLE
              value: team-c-issuer
            - name: SIGNER_SECRET
              value: customers-signer
            - name: JWKS_CONFIGMAP
              value: gateway-jwks
            - name: ISSUER
              value: https://customers.customer.lab.test
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 96Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: vault-token
              mountPath: /var/run/secrets/vault
              readOnly: true
      volumes:
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: https://kubernetes.default.svc.cluster.local
                  expirationSeconds: 3600
---
apiVersion: lab.test/v1
kind: CustomerToken
metadata:
  name: acme-customers
  namespace: team-c
spec:
  domain: customer
  api: customers
  customer: acme
  ttl: 3m
  overlap: 90s
---
apiVersion: lab.test/v1
kind: CustomerToken
metadata:
  name: globex-customers
  namespace: team-c
spec:
  domain: customer
  api: customers
  customer: globex
  ttl: 3m
  overlap: 90s
