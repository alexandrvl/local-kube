---
- name: OS baseline on every node
  hosts: k3s
  become: true
  roles:
    - os_baseline

- name: k3s server
  hosts: k3s_server
  become: true
  roles:
    - k3s_server

- name: k3s agents
  hosts: k3s_agent
  become: true
  roles:
    - k3s_agent

- name: Fetch kubeconfig and record the GitOps entrypoint
  hosts: k3s_server
  become: true
  roles:
    - kubeconfig
